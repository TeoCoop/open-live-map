<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient: deep navy at center, near-black at edges -->
    <radialGradient id="bg" cx="512" cy="460" r="560" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#111132"/>
      <stop offset="100%" stop-color="#060610"/>
    </radialGradient>

    <!-- Subtle inner glow behind the cube -->
    <radialGradient id="glow" cx="512" cy="490" r="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#1a3a8a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#060610" stop-opacity="0"/>
    </radialGradient>

    <!-- Cube edges: light blue → blue -->
    <linearGradient id="cube" x1="280" y1="320" x2="744" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#80bcff"/>
      <stop offset="100%" stop-color="#007AFF"/>
    </linearGradient>

    <!-- Corner brackets: slightly more saturated blue -->
    <linearGradient id="frame" x1="150" y1="150" x2="874" y2="874" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#3d8fff"/>
      <stop offset="100%" stop-color="#0055e0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- Center glow -->
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!--
    Original SVG: viewBox="0 0 24 24"
    Scale to 640×640 centered in 1024×1024:
      scale = 640/24 = 26.667
      translate = (1024 - 640) / 2 = 192
    stroke-width 1.6 × 26.667 ≈ 42px (≈4% of 1024, good for an icon)
  -->
  <g transform="translate(192 192) scale(26.667)">

    <!-- Cube wireframe -->
    <path
      d="M7 9.5L12 12
         M7 9.5V14.5L12 17
         M7 9.5L12 7L17 9.5
         M12 12L17 9.5
         M12 12V17
         M17 9.5V14.5L12 17"
      stroke="url(#cube)"
      stroke-width="1.6"
      stroke-linecap="round"
      stroke-linejoin="round"/>

    <!-- AR corner brackets -->
    <path
      d="M8 4H6C4.89543 4 4 4.89543 4 6V8
         M8 20H6C4.89543 20 4 19.1046 4 18V16
         M16 4H18C19.1046 4 20 4.89543 20 6V8
         M16 20H18C19.1046 20 20 19.1046 20 18V16"
      stroke="url(#frame)"
      stroke-width="1.6"
      stroke-linecap="round"
      stroke-linejoin="round"/>

  </g>
</svg>
